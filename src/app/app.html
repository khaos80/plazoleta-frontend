
<router-outlet />

<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="
    tema() === 'dark'
      ? 'Activar modo claro'
      : 'Activar modo oscuro'
  "
  [attr.title]="
    tema() === 'dark'
      ? 'Activar modo claro'
      : 'Activar modo oscuro'
  "
  (click)="alternarTema()"
>
  @if (tema() === 'dark') {
    <span aria-hidden="true">☀</span>
  } @else {
    <span aria-hidden="true">☾</span>
  }
</button>
